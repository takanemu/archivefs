name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build Linux release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build archivefs-bench
        run: cargo build --release -p archivefs-bench

      - name: Package release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_dir="archivefs-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          binary_name="archivefs-bench-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "${package_dir}"
          install -m 0755 target/release/archivefs-bench "${package_dir}/archivefs-bench"
          install -m 0755 target/release/archivefs-bench "${binary_name}"
          sha256sum "${binary_name}" > "${binary_name}.sha256"
          cp README.md "${package_dir}/"
          cp doc/api-guide.md "${package_dir}/"
          tar -czf "${package_dir}.tar.gz" "${package_dir}"
          sha256sum "${package_dir}.tar.gz" > "${package_dir}.tar.gz.sha256"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            archivefs-*.tar.gz
            archivefs-*.tar.gz.sha256
            archivefs-bench-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            archivefs-*.tar.gz \
            archivefs-*.tar.gz.sha256 \
            archivefs-bench-* \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --verify-tag
